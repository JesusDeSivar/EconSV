# Lo que EconSV muestra: cada indicador es una gráfica del sitio, armada con una o más variables de
# lago/plata/ (todas del BCR). tuberias/oro.py calcula sus vistas en lago/oro/indicadores.csv.
#
#   seccion      actividad · precios · externo · turismo · construccion
#   naturaleza   flujo (se puede sumar en el año) · saldo (se mira a fin de período) · indice
#   tipo         lineas (serie de tiempo; por defecto) · barras (serie de tiempo en barras)
#                · ranking (el último dato de cada línea, ordenado)
#   vistas       en el orden en que se ofrecen; la primera es la que abre
#       nivel             la cifra como la publica el BCR
#       var_anual         % contra el mismo período del año anterior
#       var_periodo       % contra el período anterior
#       suma_anual        suma de los últimos 12 meses o 4 trimestres (solo flujos)
#       pct_pib           flujo: suma anual ÷ PIB nominal de los mismos 4 trimestres;
#                         saldo: cifra de fin de trimestre ÷ PIB nominal de los últimos 4 trimestres
#       meses_importacion saldo ÷ promedio mensual de importaciones de mercancías (CIF) de 12 meses
#   portada      true si lleva tarjeta en la página de inicio
#   linea        serie = clave de catalogo/series.toml; id = variable_id en el portal;
#                rotulo = lo que ese id debe llamarse (la compuerta falla si el BCR lo renumera)

