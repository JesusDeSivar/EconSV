ancla_sv = ["mop", "ministerio de obras publicas", "fovial", "dom", "direccion de obras municipales", "kfw", "giz",
            "aecid", "aics", "jica", "koica", "cooperacion alemana", "cooperacion espanola", "cooperacion italiana",
