# ------------------------------------------------------------------ el gusto
# Qué notas van en los reportes diarios del dueño y en qué lugar. Lo dijo él el 2026-11-13 y sus
# titulares están fijados en pruebas/test_noticias.py. tuberias/noticias.py lo aplica así, en cada
# corrida y a toda la base:
#
#   qué entra    [medios] fuera saca medios enteros; `exige`, lo que no es fiscal ni económico de una
#                sección general; las listas de cripto, las monedas que no interesan.
#   `puntaje`    cuánto merece una nota estar entre las elegidas de su subsección: 2 por cada palabra
#                preferida de su categoría ([gusto]) en el titular y 1 en el extracto, más el peso de su
#                medio ([pesos], si la nota ya suma algo) y el bono de un dato recién publicado por el BCR ([[dato_bcr]]); menos 3
#                por cada palabra de `evita` y otros 3 si el titular es de servicio.
#   una historia La misma noticia en varios medios cuenta una vez: queda la del medio que más pesa y las
#                demás bajan al final, con puntaje 0 o menos. Lo mismo las notas de «otras fuentes» que
#                pasan de `otras_por_subseccion` y las que pasan del `maximo` de su tema.
#   `tema`       En Fiscales y en Nacionales, el tema de la nota ([[tema]]): gana el que más palabras
#                suyas tiene (el titular vale doble) y, si empatan, el que va antes. La segunda nota de
#                un tema pierde `paso_mismo_tema` puntos, la tercera el doble: quien toma las de más
#                puntaje se lleva algo de cada tema y no seis notas del mismo.
#   `orden`      El lugar de la nota en su subsección: primero las principales, por tema y dentro del
#                tema por puntaje; después las que bajaron. El sitio y la hoja de Google ordenan por aquí.
#
# Lo internacional es de corte financiero: mercados, la Fed, bonos del Tesoro, grandes operaciones de
# empresas, y en América Latina la deuda soberana, el FMI y los bancos centrales; manda Bloomberg Línea.

[reglas]
# Una regla se cumple por cualquiera de sus vías, y una vía, cuando la nota trae palabras de todas sus
# listas. `fiscales` es lo que hace «Fiscales» a una nota salvadoreña, y lo que se le exige a las
# secciones Política y Nacional de un diario: algo fiscal, o un proyecto de inversión pública, o un actor
# público junto a dinero, o un acuerdo internacional que se aprueba o ratifica, o combustibles y petróleo.
# Manda el titular: si la regla solo se cumple contando el extracto y por una única palabra de la lista
# `fiscal` («…generó ingresos tributarios»), la nota no es fiscal.
# Como el puntaje, se vuelve a aplicar a toda la base en cada corrida: depende solo de este archivo.
fiscales = [["fiscal"], ["inversion_publica"], ["actor_publico", "dinero"], ["acuerdo", "aprobacion"], ["combustibles"]]

# Lo que se le exige a una sección general de un diario (DePaís, Política, Nacionales, Social): que la
# nota sea fiscal o que sea de economía.
de_interes = [["fiscal"], ["inversion_publica"], ["actor_publico", "dinero"], ["acuerdo", "aprobacion"], ["combustibles"],
              ["economia_nacional"]]

# El precio del bitcoin (se mira solo el titular).
precio_btc = [["bitcoin", "precio"]]

[gusto]
"Internacional – EUA" = { prefiere = "gusto_mercados", evita = "evita" }
"Internacional – LATAM" = { prefiere = "gusto_soberano", evita = "evita" }
"Internacional – Resto del mundo" = { prefiere = "gusto_mundo", evita = "evita" }
"El Salvador – Fiscales" = { prefiere = "gusto_fiscal", evita = "evita" }
"El Salvador – Nacionales" = { prefiere = "gusto_economia_sv", evita = "evita" }

[gusto_listas]
# Un titular que empieza así es una nota de servicio o una explicación, no una noticia.
titular_de_servicio = ["¿", "como ", "que es ", "que son ", "cuanto ", "cuando ", "donde ", "estos son ", "estas son ",
                       "asi puedes ", "paso a paso", "conoce ", "conozca ", "guia "]


