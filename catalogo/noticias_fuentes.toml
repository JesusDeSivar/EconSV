           "uruguay", "guatemala", "honduras", "nicaragua", "costa", "rica", "panama", "cuba", "republica", "dominicana",
           "haiti", "puerto", "salvador", "san", "israel", "iran", "arabia", "saudita", "corea", "taiwan", "turquia",
           "australia", "suiza", "londres", "pekin", "tokio", "bruselas", "gobierno", "congreso", "senado", "casa",
