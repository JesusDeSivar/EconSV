          "moody*", "fitch", "standard & poor*", "deficit fiscal", "deficit presupuestario", "politica fiscal", "reforma fiscal",
          "ajuste fiscal", "regla fiscal", "sostenibilidad fiscal", "consolidacion fiscal", "gasto publico",
