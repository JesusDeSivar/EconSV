# ------------------------------------------------------------------ los temas, en su orden
# El orden de cada subsección nacional, del dueño (2026-11-13). `palabras` nombra una lista de
# [palabras]; `regla`, una de [reglas] que, si el titular la cumple, decide el tema sin contar más;
# `resto` marca el tema donde cae lo que no es de ningún otro; `maximo`, cuántas notas principales caben;
# `al_inicio`, una lista de [palabras] que decide el tema si una suya está entre las cuatro primeras del titular.

[[tema]]
categoria = "El Salvador – Fiscales"
nombre = "Deuda pública"
palabras = "tema_deuda"

[[tema]]
categoria = "El Salvador – Fiscales"
nombre = "Presupuesto"
palabras = "tema_presupuesto"

[[tema]]
categoria = "El Salvador – Fiscales"
nombre = "Otra materia fiscal"
resto = true

[[tema]]
categoria = "El Salvador – Nacionales"
nombre = "Combustibles y petróleo"
al_inicio = "combustibles"

[[tema]]
categoria = "El Salvador – Nacionales"
nombre = "Sector real"
palabras = "tema_real"

[[tema]]
categoria = "El Salvador – Nacionales"
nombre = "Sector externo"
palabras = "tema_externo"

[[tema]]
categoria = "El Salvador – Nacionales"
nombre = "Sector monetario y financiero"
palabras = "tema_monetario"

[[tema]]
categoria = "El Salvador – Nacionales"
nombre = "Turismo"
palabras = "tema_turismo"

[[tema]]
categoria = "El Salvador – Nacionales"
nombre = "Agricultura y sector primario"
palabras = "tema_agro"

[[tema]]
categoria = "El Salvador – Nacionales"
nombre = "Otros: precio del bitcoin"
regla = "precio_btc"
maximo = 1

[[tema]]
categoria = "El Salvador – Nacionales"
nombre = "Otros: investigación económica"
palabras = "tema_investigacion"

[[tema]]
categoria = "El Salvador – Nacionales"
nombre = "Otros: empresas"
palabras = "tema_empresas"

[[tema]]
categoria = "El Salvador – Nacionales"
nombre = "Otros"
resto = true

# ------------------------------------------------------------------ cuando el BCR publica
# «Presta atención a cuando salen nuevos datos del BCR»: si el calendario (lago/plata/calendario.csv,
# fechas anunciadas por el BCR) dice que una de estas series salió en los últimos `dias_dato_bcr` días,
# la nota nacional que trae sus palabras suma `bono_dato_bcr`. `series` son claves de catalogo/series.toml.

[[dato_bcr]]
series = ["pib_trimestral", "pib_trimestral_volumen", "pib_trimestral_volumen_sa", "pib_anual", "pib_anual_volumen"]
palabras = ["pib", "producto interno bruto", "crecimiento economico", "economia crecio"]

[[dato_bcr]]
series = ["ivae", "ivae_sa", "otros_indicadores"]
palabras = ["ivae", "actividad economica"]

[[dato_bcr]]
series = ["ipc", "isi"]
palabras = ["inflacion", "ipc", "precios al consumidor"]

[[dato_bcr]]
series = ["ipp"]
palabras = ["ipp", "precios al productor"]

[[dato_bcr]]
series = ["remesas"]
palabras = ["remesa*"]

[[dato_bcr]]
series = ["balanza_comercial"]
palabras = ["exportac*", "importac*", "balanza comercial", "deficit comercial"]

[[dato_bcr]]
series = ["reservas"]
palabras = ["reservas internacionales", "reservas"]

[[dato_bcr]]
series = ["balanza_pagos", "pii"]
palabras = ["balanza de pagos", "cuenta corriente", "posicion de inversion"]

[[dato_bcr]]
series = ["ied", "ied_ciiu"]
palabras = ["inversion extranjera", "ied"]
