# Las fuentes de noticias que lee tuberias/noticias.py cada mañana, y cómo se reparte cada nota en
# las cinco categorías de la tabla.
#
# De cada nota se guarda solo lo que su propio medio publica en su feed: titular, extracto (cortado a
# `largo_resumen` caracteres), fecha y enlace. Nunca el texto completo. Una noticia es contexto: las
# cifras del sitio salen del BCR, no de aquí.
#
#   metodo     rss     un feed RSS o Atom
#              elmundo la portada de una sección de diario.elmundo.sv, que no tiene feed: de ahí salen
#                      título, fecha y enlace, y de la página de cada nota nueva solo su extracto
#                      (la etiqueta og:description); `paginas` dice cuántas páginas de la sección
#              wp_api  la API pública de WordPress del medio (/wp-json/wp/v2/posts), con `secciones`
#              gnews   una búsqueda de Google News en RSS: trae titular, medio y enlace, sin extracto;
#                      sirve para los medios que no dejan leer su feed (La Prensa Gráfica, El Mundo)
#   medio      en una búsqueda de Google News de un solo sitio (site:), el nombre con que se guarda
#              la fuente; sin él, queda «Medio (vía Google News)»
#   categoria  la categoría de la nota cuando sus palabras no dicen otra cosa
#   filtro     true: el feed trae de todo y solo entran las notas con palabras de economía
#   exige      lo que una nota tiene que cumplir para entrar: el nombre de una lista de [palabras] (trae
#              alguna) o de una de las [reglas]; con varios nombres, todos. Las búsquedas de Google
#              sobre El Salvador devuelven también notas de otros países, y las secciones Política y
#              Nacional de un diario traen de todo: de ahí solo entra lo que cumple la regla `fiscales`
#   opcional   true: si la fuente no responde, se anota y la corrida sigue sin fallar
#
# Cuánto pesa cada medio está en [pesos], y los que no entran, en [medios]; qué notas van primero en
# cada subsección, en los bloques [[tema]], al final.
#
# Reparto (tuberias/noticias.py, `clasificar`): una nota que menciona El Salvador es salvadoreña, y es
# «Fiscales» si cumple la regla `fiscales` (al final: dinero público, o lo que ratifica la Asamblea);
# lo deciden sus palabras, no la sección de donde vino. Si no menciona El Salvador, las palabras de región deciden
# entre EUA, LATAM y resto del mundo; sin palabras de región, vale la `categoria` de la fuente. Son
# coincidencias de palabras, no una lectura de la nota: sirven para ordenar, y se equivocan a veces.

[general]
agente = "Mozilla/5.0 (compatible; lector-de-titulares)"
pausa = 1.0                 # segundos entre pedidos
dias = 3                    # se toman las notas publicadas en los últimos días
largo_resumen = 300
conservar_dias = 120        # las ediciones más viejas salen del lago (quedan en el historial de git)
hora_de_corte = 7           # la edición del día D reúne lo publicado de las 7:00 de D−1 a las 7:00 de D
otras_por_subseccion = 2    # en cada subsección, cuántas notas de medios sin peso ([pesos]) quedan entre las principales
paso_mismo_tema = 3         # puntos que pierde la segunda nota de un mismo tema (la tercera, el doble…): así las elegidas cubren todos los temas
misma_historia = 0.6        # dos titulares son la misma historia si comparten esta parte de las palabras del más corto
bono_dato_bcr = 6           # puntos que suma una nota nacional que recoge un dato que el BCR acaba de publicar
dias_dato_bcr = 2           # … durante cuántos días después de la fecha del calendario del BCR

