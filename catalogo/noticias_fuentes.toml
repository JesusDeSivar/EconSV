# ------------------------------------------------------------------ medios y pesos
[medios]
# No entran, lleguen por donde lleguen (casi todos, por Google News). Lista del dueño, 2026-11-13. Se
# compara con el nombre del medio, sin mayúsculas ni tildes y por palabra entera: "el pais" saca a
# «EL PAÍS» y a «El País América»; "dw", a «DW · Economía». También se aplica a lo ya guardado.
fuera = ["clarin", "comercio tv", "comerciotv", "debate", "diario digital cronio", "diariodigitalrd", "expansion",
         "funds society", "fxstreet", "howl.link", "infobae", "el pais", "la cronica de hoy", "la nacion costa rica",
         "la republica ec", "lancasteronline", "luz noticias", "marketscreener", "noticias24hrs", "ntn24", "quartz",
         "advfn", "rfi", "rosario finanzas", "san antonio express-news", "talcual", "universitat de valencia",
         "univision", "xtb", "dw"]

# Puntos que suma al puntaje de una nota el medio que la publica, llegue por su feed o por Google
# News. En lo internacional manda Bloomberg Línea (lo dijo el dueño el 2026-11-13); en lo nacional, el
# orden sale de lo que él elige en sus reportes (ver [pesos.nacional]). Con 1 van los medios conocidos que no tienen lugar en ese orden. Un medio que no está en la
# tabla es «otra fuente»: suma 0 y solo `otras_por_subseccion` notas suyas quedan entre las
# principales de cada subsección; así un medio nuevo que aparezca en Google News no la llena.
[pesos.internacional]
"Bloomberg Línea" = 3
"Reserva Federal" = 1
"Bureau of Economic Analysis" = 1
"Banco Central Europeo" = 1
"BBC Mundo · Economía" = 1
"France 24 · Economía" = 1
"France 24 · América Latina" = 1
"elEconomista.net" = 1
"Diario El Salvador" = 1
"Diario El Mundo" = 1
"La Prensa Gráfica" = 1
"El Diario de Hoy" = 1

[pesos.nacional]
# Medido en sus reportes del 13, 16, 17 y 18 de noviembre (52 notas nacionales): eligió 26 de las 47 notas
# de Diario El Mundo que la base ofrecía, 12 de 27 de El Diario de Hoy, 9 de 24 de La Prensa Gráfica, 5 de
# 52 de Diario El Salvador y ninguna de 8 de elEconomista.net. Con el orden que había dictado el 13
# (elEconomista.net, Diario El Salvador, El Mundo, La Prensa Gráfica, El Diario de Hoy), Diario El Salvador,
# que es lo que más publica, llenaba los primeros lugares. La Prensa Gráfica llega sin extracto y suma
# menos palabras: su peso lo compensa.
"Diario El Mundo" = 6
"El Diario de Hoy" = 5
"La Prensa Gráfica" = 5
"elEconomista.net" = 3
"Diario El Salvador" = 2
"Bloomberg Línea" = 1
"Ministerio de Hacienda" = 1
"Banco Central de Reserva" = 1
"Presidencia de la República" = 1
# El sitio de quien financia es la fuente primaria de un préstamo o una donación: no es «otra fuente».
"BCIE" = 1
"BID" = 1
"Banco Mundial" = 1
"CAF" = 1
"FMI" = 1

# ------------------------------------------------------------------ palabras
# Sin mayúsculas ni tildes, por palabra entera. Un * vale por el resto de la palabra: «prestamo*» es
# préstamo y préstamos, y «obra* publica*», obra pública y obras públicas.

[palabras]
el_salvador = ["el salvador", "salvadoren*", "san salvador", "bukele", "banco central de reserva",
