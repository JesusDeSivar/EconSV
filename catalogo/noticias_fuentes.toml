"Diario El Salvador" = 5
"Diario El Mundo" = 4
"La Prensa Gráfica" = 3
"El Diario de Hoy" = 2
"Bloomberg Línea" = 1
"Ministerio de Hacienda" = 1
"Banco Central de Reserva" = 1
"Presidencia de la República" = 1

