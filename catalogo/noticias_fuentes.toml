# ------------------------------------------------------------------ medios y pesos
[medios]
# No entran, lleguen por donde lleguen (casi todos, por Google News). Lista del dueño, 2026-11-13. Se
# compara con el nombre del medio, sin mayúsculas ni tildes y por palabra entera: "el pais" saca a
# «EL PAÍS» y a «El País América»; "dw", a «DW · Economía». También se aplica a lo ya guardado.
fuera = ["clarin", "comercio tv", "comerciotv", "debate", "diario digital cronio", "diariodigitalrd", "expansion",
         "funds society", "fxstreet", "howl.link", "infobae", "el pais", "la cronica de hoy", "la nacion costa rica",
         "la republica ec", "lancasteronline", "luz noticias", "marketscreener", "noticias24hrs", "ntn24", "quartz",
         "advfn", "rfi", "rosario finanzas", "san antonio express-news", "talcual", "universitat de valencia",
         "univision", "xtb", "dw"]

# Puntos que suma al puntaje de una nota el medio que la publica, llegue por su feed o por Google
# News. El orden es del dueño (2026-11-13): en lo internacional manda Bloomberg Línea; en lo nacional,
# elEconomista.net, Diario El Salvador, Diario El Mundo, La Prensa Gráfica y El Diario de Hoy, en ese
# orden. Con 1 van los medios conocidos que no tienen lugar en ese orden. Un medio que no está en la
# tabla es «otra fuente»: suma 0 y solo `otras_por_subseccion` notas suyas quedan entre las
# principales de cada subsección; así un medio nuevo que aparezca en Google News no la llena.
[pesos.internacional]
"Bloomberg Línea" = 3
"Reserva Federal" = 1
"Bureau of Economic Analysis" = 1
"Banco Central Europeo" = 1
"BBC Mundo · Economía" = 1
"France 24 · Economía" = 1
"France 24 · América Latina" = 1
"elEconomista.net" = 1
"Diario El Salvador" = 1
"Diario El Mundo" = 1
"La Prensa Gráfica" = 1
"El Diario de Hoy" = 1

[pesos.nacional]
