# Proyectos de inversión pública (lista del dueño, 2026-11-13: no solo BCIE y BID, cualquier proyecto). Quien
# la ejecuta basta para que una nota salvadoreña sea «Fiscales»: el MOP, FOVIAL, la DOM. Quien la financia
# no basta solo: tiene que haber dinero de por medio (`financiamiento`). «El BCIE acompaña un foro» o «la IA
# elevaría el PIB, según el BID» no son fiscales; «BCIE aprueba US$42 millones» o «becas con apoyo del BCIE»,
# sí. Las dos listas suben el puntaje en Fiscales.
financiador = ["bcie", "banco centroamericano de integracion economica", "bid", "banco interamericano de desarrollo",
