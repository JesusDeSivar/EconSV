               "luxemburgo", "usaid", "fida", "ofid", "opep fund", "banco europeo de inversiones"]

ejecutor = ["mop", "ministerio de obras publicas", "fovial", "fondo de conservacion vial", "dom",
            "direccion de obras municipales", "inversion publica", "obra* publica*", "proyecto* de inversion", "paip",
