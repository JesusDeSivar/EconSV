# ------------------------------------------------------------------ el gusto
# Qué notas se parecen a las que el dueño pone en sus reportes diarios (leídos el 2026-11-13 en su
# edición del 10 de noviembre). Lo internacional es de corte financiero: mercados, la Fed, bonos del
# Tesoro, grandes operaciones de empresas, y en América Latina la deuda soberana, el FMI y los bancos
# centrales. Lo nacional sale sobre todo de Diario El Mundo: en Fiscales, el presupuesto de cada
# ministerio, los contratos y el gasto público; en lo económico, las cifras del BCR, CEPA, turismo,
# inversión, agro y empresas. tuberias/noticias.py (`puntaje`) suma 2 por cada palabra preferida en el
# titular, 1 en el extracto y el `peso` de la fuente, y resta 3 por cada palabra de `evita` y otros 3 si
# el titular empieza como una nota de servicio. El puntaje ordena dentro de cada categoría.

[gusto]
"Internacional – EUA" = { prefiere = "gusto_mercados", evita = "evita" }
"Internacional – LATAM" = { prefiere = "gusto_soberano", evita = "evita" }
"Internacional – Resto del mundo" = { prefiere = "gusto_mundo", evita = "evita" }
"El Salvador – Fiscales" = { prefiere = "gusto_fiscal", evita = "evita" }
"El Salvador – Nacionales" = { prefiere = "gusto_economia_sv", evita = "evita" }

[gusto_listas]
# Un titular que empieza así es una nota de servicio o una explicación, no una noticia.
titular_de_servicio = ["¿", "como ", "que es ", "que son ", "cuanto ", "cuando ", "donde ", "estos son ", "estas son ",
                       "asi puedes ", "paso a paso", "conoce ", "conozca ", "guia "]
