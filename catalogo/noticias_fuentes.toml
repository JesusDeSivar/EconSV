            "cooperacion internacional", "asamblea legislativa", "ministerio de hacienda",
            "alcaldia*", "diputados", "comision de hacienda"]

# Quién gasta dinero público y cómo se nombra ese dinero. Ninguna de las dos listas basta sola: «alcaldía»
# está en la nota de una perrita rescatada y «millones» en la de 5.4 millones de consultas médicas. Juntas
# sí dicen algo (una alcaldía que debe salarios, un ministerio que contrata): es la tercera vía de la
# regla `fiscales`. "$cifra" no es una palabra: es cualquier monto escrito en dólares ($5,000).
actor_publico = ["gobierno", "alcaldia*", "alcalde*", "comuna*", "concejo* municipal*", "ministerio*",
                 "asamblea", "diputad*", "presidencia", "casa presidencial", "autonoma*", "sector publico",
                 "empleados publicos", "instituciones publicas", "tse", "tribunal supremo electoral",
                 "corte de cuentas"]

dinero = ["$cifra", "millones de dolares", "salario*", "salarial*", "sueldo*", "aguinaldo*", "plazas", "despido*", "fondos",
          "fodes", "financia*", "contrat*", "gasto*", "ahorro*", "recorte*", "auditoria*", "auditor*", "auditar*",
          "audita", "auditan", "audito", "inversion", "invert*", "inviert*", "bono", "cooperacion", "adeuda*", "pago*",
          "arancel*", "donacion*", "donativo*", "dona", "donan", "dono"]
# Una donación sola no es asunto fiscal (un supermercado que dona a una fundación): cuenta como dinero,
# y hace falta que la reciba o la dé un actor público.

# La cuarta vía: un acuerdo internacional que se aprueba. Los reportes del dueño ponen en Fiscales lo que
# ratifica la Asamblea (protección de inversiones con Argentina, exención de visas con Kuwait). «Acuerdo»
# va con su preposición porque suelto está en cada «de acuerdo con el ministerio».
acuerdo = ["acuerdo de", "acuerdo para", "acuerdo entre", "acuerdo sobre", "acuerdo bilateral", "acuerdo comercial",
