inversion_publica = ["bcie", "banco centroamericano de integracion economica", "bid", "banco interamericano de desarrollo",
                     "caf", "banco de desarrollo de america latina", "banco mundial", "birf",
                     "banco internacional de reconstruccion y fomento", "kfw", "cooperacion alemana", "giz",
                     "cooperacion espanola", "aecid", "cooperacion italiana", "aics", "cooperacion japonesa", "jica",
                     "cooperacion coreana", "koica", "cooperacion internacional", "cooperacion china", "cooperacion estadounidense",
