# Las series que EconSV toma del portal de estadísticas del Banco Central de Reserva de El Salvador
# (https://estadisticas.bcr.gob.sv/serie/<slug>). Todas son información pública del BCR.
#
#   clave        el nombre de la serie en el lago: lago/bronce/bcr/<clave>.json, lago/plata/bcr_<clave>.csv
#   slug         la dirección de la serie en el portal
#   frecuencia   M mensual · T trimestral · A anual (se contrasta con lo que declara el portal)
#   calendario   el título con que el BCR anuncia su publicación en el calendario de divulgación
#                (https://estadisticas.bcr.gob.sv/calendario-de-divulgacion). El BCR anuncia un título
#                por familia de cuadros: los del PIB trimestral salen con su serie desestacionalizada,
#                el IVAE original y «otros indicadores» con el IVAE desestacionalizado, y la IED por
#                CIIU con la IED por sector. Una serie anual que apunta a un título trimestral se
#                espera con el cuarto trimestre de su año (el PIB anual sale con el PIB T del T4).
#   rezago_dias  días entre el fin del período y la publicación; se usa cuando el calendario del BCR
#                todavía no anuncia el período que sigue
#   tramo        (opcional) años por pedido; por defecto 4 en mensuales y 10 en trimestrales

